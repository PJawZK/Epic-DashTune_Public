name: Import curated 1207 source

on:
  push:
    branches:
      - public/sync-1207

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public sync branch
        uses: actions/checkout@v4
        with:
          ref: public/sync-1207
          fetch-depth: 1

      - name: Import exact curated private snapshot
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/import1207"
          mkdir -p "$TMP/export"
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-b17c-8206-97c4-bd0d32c13808/raw?se=2026-09-24T18%3A49%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=4ff91551-6ec0-5ec2-a62c-4bb89ed3cc7d&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T18%3A01%3A57Z&ske=2026-09-25T18%3A01%3A57Z&sks=b&skv=2026-02-06&sig=sK%2BC0Haary9pYviSdEiCAcupRu2e%2Bcd5XNMSjOWqtWo%3D' -o "$TMP/source.zip"
          echo 'a8cdf88f59f704ad76774f753ed262d96cde32c96e44b7cd58a7c30dc2c050db  '"$TMP/source.zip" | sha256sum -c -
          unzip -q "$TMP/source.zip" -d "$TMP/export"
          test "$(grep '^Exact application-source baseline:' "$TMP/export/PRIVATE_SOURCE.txt" | awk '{print $4}')" = '9de5f4129cddc75692b39b84069f658c6a92ce61'

          cp app/src/main/res/drawable/epicdash_jz_logo.xml "$TMP/epicdash_jz_logo.xml"

          rsync -a --delete "$TMP/export/app/" app/
          mkdir -p app/src/main/res/drawable
          cp "$TMP/epicdash_jz_logo.xml" app/src/main/res/drawable/epicdash_jz_logo.xml

          rsync -a --delete "$TMP/export/gradle/" gradle/
          rsync -a --delete "$TMP/export/tools/" tools/

          for f in .gitattributes .gitignore build-jz.sh build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat; do
            if [ -f "$TMP/export/$f" ]; then cp -p "$TMP/export/$f" "$f"; fi
          done
          cp "$TMP/export/PRIVATE_SOURCE.txt" PRIVATE_SOURCE.txt
          cp "$TMP/export/FILE_MANIFEST.sha256" CURATED_PRIVATE_MANIFEST.sha256

          find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.apk' -o -name '*.aab' -o -name '*.mlg' -o -name 'local.properties' -o -name 'signing.properties' \) -not -path './.git/*' -print -quit | grep -q . && { echo 'Forbidden public file present' >&2; exit 1; } || true
          git status --short

      - name: Commit curated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Public sync: Epic DashTune 0.12.5 RC1 compatibility baseline'
          git push origin HEAD:public/sync-1207
