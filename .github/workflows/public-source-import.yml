name: One-time curated public source import

on:
  push:
    branches:
      - public/initial-foundation

permissions:
  contents: write

jobs:
  import:
    name: Verify and commit curated source tree
    runs-on: ubuntu-latest

    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: public/initial-foundation
          fetch-depth: 0

      - name: Download and verify reviewed export artifact
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-5204-8246-b79d-dd68f090782e/raw?se=2026-08-03T13:08:23Z&sp=r&sv=2026-02-06&sr=b&scid=3dc48141-a99a-5420-8051-51d0d49feaaa&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T11:14:08Z&ske=2026-08-04T11:14:08Z&sks=b&skv=2026-02-06&sig=FkezvL5zfCnFRZWpbYcVMn%2BMzEJaFB%2BrxnwwVL0lHEA%3D'
          SOURCE_ZIP_SHA256: '8e8aea1543b0f32866325289533ebaf2af2c8cd8f5149d0e952ae6027a53fe8f'
          OVERLAY_SHA256: '54aeec938b1c89f7346988d7b2cc7b3e01002a73fbc64d410b609b03fa7efbc0'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/epic-public-import"
          rm -rf "$work"
          mkdir -p "$work/outer" "$work/stage"

          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" -o "$work/source-artifact.zip"
          echo "$SOURCE_ZIP_SHA256  $work/source-artifact.zip" | sha256sum -c -
          unzip -q "$work/source-artifact.zip" -d "$work/outer"
          (cd "$work/outer" && sha256sum -c epic-dashtune-public-source.zip.sha256)
          unzip -q "$work/outer/epic-dashtune-public-source.zip" -d "$work/unpacked"
          cp -a "$work/unpacked/epic-dashtune-public-source"/. "$work/stage"/
          rm -f "$work/stage/FILE_MANIFEST.sha256" "$work/stage/SOURCE_PROVENANCE.txt"

          cat > "$work/overlay.tar.gz.b64" <<'OVERLAY_EOF'

OVERLAY_EOF
          base64 --decode "$work/overlay.tar.gz.b64" > "$work/overlay.tar.gz"
          echo "$OVERLAY_SHA256  $work/overlay.tar.gz" | sha256sum -c -
          tar -xzf "$work/overlay.tar.gz" -C "$work/stage"

          cd "$work/stage"
          find . -type f ! -path './FILE_MANIFEST.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > FILE_MANIFEST.sha256
          sha256sum -c FILE_MANIFEST.sha256 >/dev/null

          if find . -type f \( -iname '*.keystore' -o -iname '*.jks' -o -iname '*.p12' -o -iname 'signing.properties' -o -iname 'local.properties' -o -iname '*.apk' -o -iname '*.aab' -o -iname '*.msl' -o -iname '*.mlg' \) -print -quit | grep -q .; then
            echo 'Forbidden file found in public import' >&2
            exit 1
          fi

          if grep -RIlE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|EPICDASH_STORE_PASSWORD=|EPICDASH_KEY_PASSWORD=|/home/jawz|JZ-Main)' . --exclude='FILE_MANIFEST.sha256' | grep -q .; then
            echo 'Potential private or secret-bearing content found' >&2
            exit 1
          fi

          python3 tools/validate-dashboard.py
          python3 tools/test-dashboard-regressions.py
          for test in app/src/test/js/*.js; do node "$test" >/dev/null; done

          chmod +x gradlew build-jz.sh
          rsync -a --delete --exclude='.git/' "$work/stage/" "$GITHUB_WORKSPACE/"

      - name: Commit reviewed public source import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --stat
          git commit -m 'Import curated Epic DashTune Android source'
          git push origin HEAD:public/initial-foundation
