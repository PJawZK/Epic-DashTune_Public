name: One-time curated public source import

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'public/initial-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public/initial-foundation
          fetch-depth: 0

      - name: Reconstruct reviewed public tree
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-db4c-81f4-a7cb-472c5d198234/raw?se=2026-08-03T14:08:33Z&sp=r&sv=2026-02-06&sr=b&scid=04d801ea-207f-5a80-9a5f-1573c273398e&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T11:09:42Z&ske=2026-08-04T11:09:42Z&sks=b&skv=2026-02-06&sig=8/15hZs2m%2Bab9qSIvgYy5BO1gLrOph77UeqhMOf58zc%3D'
          SOURCE_ARTIFACT_SHA256: '8e8aea1543b0f32866325289533ebaf2af2c8cd8f5149d0e952ae6027a53fe8f'
          OVERLAY_SHA256: '255a5b99fbc0ab9aea9075643fa7984e8643a6bf76abe55c873506e1a8fbcdd1'
          FINAL_MANIFEST_SHA256: 'd8ccc04d9c32e6690d380deb3b9e167cd44810b9eca97162bbb16fd4c19e3b87'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/epic-public-import"
          rm -rf "$work"
          mkdir -p "$work/outer" "$work/stage"

          curl --fail --location --retry 3 --retry-all-errors "$SOURCE_URL" -o "$work/artifact.zip"
          echo "$SOURCE_ARTIFACT_SHA256  $work/artifact.zip" | sha256sum -c -
          unzip -q "$work/artifact.zip" -d "$work/outer"
          (cd "$work/outer" && sha256sum -c epic-dashtune-public-source.zip.sha256)
          unzip -q "$work/outer/epic-dashtune-public-source.zip" -d "$work/unpacked"
          cp -a "$work/unpacked/epic-dashtune-public-source"/. "$work/stage"/

          rm -f \
            "$work/stage/SOURCE_PROVENANCE.txt" \
            "$work/stage/FILE_MANIFEST.sha256" \
            "$work/stage/gradlew" \
            "$work/stage/gradlew.bat" \
            "$work/stage/gradle/wrapper/gradle-wrapper.jar" \
            "$work/stage/app/src/main/res/drawable-nodpi/epicdash_jz_logo.png" \
            "$work/stage/app/src/main/res/drawable/logo_epicdash.png"
          rmdir "$work/stage/app/src/main/res/drawable-nodpi" 2>/dev/null || true

          cat > "$work/overlay.tar.gz.b64" <<'OVERLAY_EOF'

OVERLAY_EOF
          base64 --decode "$work/overlay.tar.gz.b64" > "$work/overlay.tar.gz"
          echo "$OVERLAY_SHA256  $work/overlay.tar.gz" | sha256sum -c -
          tar -xzf "$work/overlay.tar.gz" -C "$work/stage"

          cd "$work/stage"
          find . -type f ! -name FILE_MANIFEST.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sed 's#  ./#  #' > FILE_MANIFEST.sha256
          echo "$FINAL_MANIFEST_SHA256  FILE_MANIFEST.sha256" | sha256sum -c -
          sha256sum -c FILE_MANIFEST.sha256 >/dev/null

          if find . -type f \( -iname '*.keystore' -o -iname '*.jks' -o -iname '*.p12' -o -iname 'signing.properties' -o -iname 'local.properties' -o -iname '*.apk' -o -iname '*.aab' -o -iname '*.msl' -o -iname '*.mlg' \) -print -quit | grep -q .; then
            echo 'Forbidden file found in public import' >&2
            exit 1
          fi
          if grep -RIlE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|EPICDASH_STORE_PASSWORD=|EPICDASH_KEY_PASSWORD=|/home/jawz|JZ-Main)' . --exclude=FILE_MANIFEST.sha256 | grep -q .; then
            echo 'Potential private or secret-bearing content found' >&2
            exit 1
          fi

          python3 tools/validate-dashboard.py
          python3 tools/test-dashboard-regressions.py
          for test in app/src/test/js/*.js; do node "$test" >/dev/null; done

          rsync -a --delete --exclude='.git/' "$work/stage/" "$GITHUB_WORKSPACE/"

      - name: Commit reviewed import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --stat
          git commit -m 'Import curated Epic DashTune Android source'
          git push origin HEAD:public/initial-foundation
