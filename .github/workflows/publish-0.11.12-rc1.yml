name: Publish Epic DashTune 0.11.12 RC1

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.head_ref == 'release/0.11.12-rc1-publish'
    runs-on: ubuntu-latest

    steps:
      - name: Check out release payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Execute checksum-locked RC1 publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! test -f release_payload/READY; then
            echo 'RC1 payload is not marked ready; publication skipped.'
            exit 0
          fi
          sed -i 's/"$ZIPALIGN" -c -P 16 -v 4/"$ZIPALIGN" -c -p -v 4/' release_payload/publish.sh
          bash release_payload/publish.sh
