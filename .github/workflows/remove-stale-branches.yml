name: Remove stale branches

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'maintenance/remove-stale-branches'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main with authenticated remote
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete redundant branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'public/initial-curated-import'
            'public/initial-foundation'
            'release/v0.11.12-rc1-repository-update'
            'maintenance/remove-stale-branches'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
