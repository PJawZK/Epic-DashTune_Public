name: Update 0.12.5 RC1 release notes

on:
  push:
    paths:
      - '.github/workflows/update-0.12.5-rc.1-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # Epic DashTune 0.12.5 RC1 — public compatibility test

          Epic DashTune is now the legacy compatibility-test application. Active long-term development has moved to **EpicEFI – EpicHub**.

          This pre-release is intentionally published to gather real-world evidence from different Android devices, generated `mainController.ini` files, firmware signatures, and EpicEFI/rusEFI STM32 hardware. Findings should be used to improve EpicHub connection/profile compatibility.

          ## What's changed since 0.11.12 RC1

          This is a major step forward from the previous public RC rather than a small maintenance update.

          ### Firmware-driven ECU recognition

          - USB VID/PID is no longer treated as board identity.
          - Known STM32/rusEFI USB transport is opened only far enough to read the live TunerStudio signature.
          - The complete live signature is used as firmware identity authority.
          - A genuine imported generated `mainController.ini` must match that full signature before normal protocol/tuning authority is enabled.
          - Recognized hardware without a matching imported profile stops fail-closed at `NO_PROFILE`.
          - Board names remain descriptive only; tune/runtime geometry is taken from the generated profile instead of board-name assumptions.

          ### Generated-INI driven Tuner

          - `mainController.ini` now drives Tuner structure, menus, parameters, tables and curves.
          - Complete native TuneSnapshot acquisition is the tune-value authority.
          - Runtime/output-channel geometry and calibration-page geometry are profile-driven.
          - Cross-board compatibility regression coverage now includes differing generated signatures and memory layouts rather than assuming MEGA144H7 geometry everywhere.

          ### Guarded native tuning writes and Burn

          The old public RC was ECU read-only. This RC now contains the guarded native tuning path developed since then:

          - semantic parameter/table/curve edits;
          - native target resolution;
          - bounded ECU RAM writes;
          - exact acknowledgement/read-back;
          - full expected TuneSnapshot verification after writes;
          - dirty-RAM state tracking;
          - separate explicit Burn;
          - post-Burn full verification.

          WebView code does not own raw ECU transport or page/offset write authority. Unknown, stale or mismatched profile/generation states fail closed.

          ### Tuner UI expansion

          - hierarchical Tuner navigation;
          - native-backed Parameters, Tables and Curves editors;
          - responsive phone/tablet layouts;
          - portrait/landscape handling and rotation-lock corrections;
          - shared Tuner shell/header/actions;
          - table editing workflow and curve interaction improvements;
          - old legacy first-paint Tuner presentation removed from the current shell.

          ### Offline project and recovery support

          - verified TuneSnapshot persistence;
          - offline Parameters/Tables/Curves project surfaces;
          - offline edits remain separated from ECU write/Burn authority;
          - recovery bundle support for reinstall/no-project situations;
          - exact-snapshot draft handling rather than fabricating live ECU authority while disconnected.

          ### 1207 live-performance architecture

          1207 specifically removes the largest live Tuner performance problem seen in 1206:

          - live bulk workspace JSON no longer embeds full array cell values;
          - array details are requested semantically from native code on demand;
          - saved/offline permanent-project construction is deferred until actually needed;
          - the live render path no longer deep-clones the complete workspace after every render;
          - Curves sizing uses measured container geometry;
          - uncaught Java/Kotlin crash information is persisted into diagnostics when available.

          In the captured SM-A137F/MEGA144H7 1207 session, the former roughly 13.5–14 million-character live project payload was reduced to a 249-character deferred marker, while streaming remained around 19.5 Hz with zero CRC/protocol errors in that session.

          ### Diagnostics and runtime hardening

          This public baseline also includes accumulated work on:

          - reconnect/stale-data handling;
          - lifecycle/ownership diagnostics;
          - active-view diagnostics;
          - storage save/capacity/recovery checks;
          - GPS data-truth handling;
          - analysis-history scaling;
          - BLE queue/progress instrumentation;
          - crash evidence retention;
          - production Tuner authority regression tests.

          ## Known limitations / unfinished work

          This is still a compatibility-test RC, not a production-final release.

          Remaining measured performance costs include:

          - compiled-profile decode/restore;
          - post-write workspace rebuild/serialization;
          - on-demand offline permanent-project construction;
          - initial full TuneSnapshot acquisition.

          Broad physical qualification across different Android devices, ECU boards, firmware versions and generated INIs has **not** been completed. That is the main reason this public build exists.

          ## Exact identity

          - Application: `0.12.5-tuner-live-lazy-jz / 1207`
          - Package: `com.buttonbox.ble.jz`
          - Public source commit: `05e0a1797d78c51bcad7c52f4b4911134ae7fe22`
          - Private integrated application-source baseline: `9de5f4129cddc75692b39b84069f658c6a92ce61`
          - Public Android quality: `#27 / 36045486190` — PASS
          - APK SHA-256: `164af502c97dc3fba29c96640945b77ea2a30d5cf40f247bb62203f4157e17ae`

          ## Important signing note

          The attached APK is the exact **public CI debug APK** from the qualified public-main run. It is suitable for compatibility testing, but it is debug-signed and therefore will not update an installation that uses the older maintainer continuity signer. Install it as a fresh test build where Android signing rules require that.

          ## Safety warning

          This build is **not ECU read-only**. With an exact matching generated INI, current ECU generation/signature, and complete verified TuneSnapshot, it can perform guarded semantic RAM tune writes and a separate explicit Burn. Do not alter tuning or Burn unless you intentionally mean to change ECU state and have appropriate recovery procedures.

          Unknown or ambiguous hardware/profile states fail closed. USB VID/PID alone is not treated as ECU identity. The complete live TunerStudio signature plus an exact imported generated-INI signature match owns protocol/tuning authority.

          ## What to report

          The most useful reports include:

          - Android device/model and Android version;
          - ECU board/hardware;
          - exact firmware/TunerStudio signature;
          - whether the genuine generated `mainController.ini` imports and matches;
          - whether preflight, complete TuneSnapshot and live streaming succeed;
          - whether live channels decode correctly;
          - any unsupported INI construct, fail-closed state, crash or major performance problem;
          - an exported diagnostics report when possible.

          Findings from this compatibility-test release are intended to feed directly into **EpicEFI – EpicHub** connection/profile compatibility work.
          EOF

          BODY="$(cat /tmp/release-notes.md)"
          gh api --method PATCH repos/PJawZK/Epic-DashTune_Public/releases/396273240 -f body="$BODY" >/dev/null
