name: Temporary public source import bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'public/initial-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public/initial-foundation
          fetch-depth: 0

      - name: Execute reviewed importer
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6a54-81f4-bd48-d9f8565f575f/raw?se=2026-08-03T14:19:11Z&sp=r&sv=2026-02-06&sr=b&scid=a5e7de32-75f2-5692-8dc8-8df0e5937bb5&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T11:24:34Z&ske=2026-08-04T11:24:34Z&sks=b&skv=2026-02-06&sig=DY/xFzjPA%2BHsHBNIAKoMMNjuU8OQPFe6GXnO8Tn%2BLuc%3D'
          SOURCE_ARTIFACT_SHA256: '8e8aea1543b0f32866325289533ebaf2af2c8cd8f5149d0e952ae6027a53fe8f'
          OVERLAY_SHA256: '255a5b99fbc0ab9aea9075643fa7984e8643a6bf76abe55c873506e1a8fbcdd1'
          FINAL_MANIFEST_SHA256: 'd8ccc04d9c32e6690d380deb3b9e167cd44810b9eca97162bbb16fd4c19e3b87'
        run: |
          set -euo pipefail
          awk '
            /^      - name: Reconstruct reviewed public tree$/ { found=1; next }
            found && /^        run: \|$/ { capture=1; next }
            capture && /^      - name: Commit reviewed import$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/public-source-import.yml > "$RUNNER_TEMP/import.sh"
          test -s "$RUNNER_TEMP/import.sh"
          bash "$RUNNER_TEMP/import.sh"

          # GITHUB_TOKEN cannot create or update workflow files. The authorized
          # connector installs the reviewed CI workflow after this bulk import.
          rm -f .github/workflows/android-quality.yml FILE_MANIFEST.sha256
          find . -path ./.git -prune -o -type f ! -name FILE_MANIFEST.sha256 -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > FILE_MANIFEST.sha256
          sha256sum -c FILE_MANIFEST.sha256 >/dev/null

      - name: Commit reviewed public tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --stat
          git commit -m 'Import curated Epic DashTune Android source'
          git push origin HEAD:public/initial-foundation
